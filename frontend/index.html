<!doctype html>
<html lang="en" data-theme="dark" data-comfort="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1714" />
    <meta
      name="description"
      content="Orvexa — turn team work into visible progress. Projects, tasks, real-time collaboration and productivity analytics in one calm workspace."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Orvexa — Turn Team Work Into Visible Progress</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('orvexa.theme') || 'system';
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : stored;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.comfort =
            localStorage.getItem('orvexa.comfort') || 'normal';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
